[project]
name = "reverse-api-engineer"
version = "0.13.0"
description = "The agent that turns websites into APIs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kalil", email = "kalil0321@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = [
    "api",
    "api-client",
    "reverse-engineering",
    "web-scraping",
    "scraping",
    "ai",
    "llm",
    "agent",
    "claude",
    "claude-code",
    "mcp",
    "har",
    "playwright",
    "browser-automation",
    "code-generation",
    "codegen",
    "python",
    "typescript",
    "openapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.0",
    "claude-agent-sdk>=0.1.48",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "watchdog>=3.0.0",
    "setproctitle>=1.3.0",
    "requests>=2.33.0",
    "aiohttp>=3.13.4",
    "pygments>=2.20.0",
    "cryptography>=46.0.7",
]

[project.optional-dependencies]
# Manual capture mode drives a local Playwright browser. Agent mode (the
# default) uses external MCP servers over npx and needs none of this, so the
# heavy browser stack is opt-in — keeping the base install lightweight.
manual = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
]
collector = [
    "markdownify>=0.12.0",
    "beautifulsoup4>=4.12.0",
]
copilot = [
    "github-copilot-sdk>=0.1.0",
]

[project.urls]
Homepage = "https://reverseapi.dev"
Documentation = "https://reverseapi.dev/docs"
Cloud = "https://anything.notte.cc"
Repository = "https://github.com/kalil0321/reverse-api-engineer"
Issues = "https://github.com/kalil0321/reverse-api-engineer/issues"
Changelog = "https://github.com/kalil0321/reverse-api-engineer/blob/main/CHANGELOG.md"

[project.scripts]
reverse-api-engineer = "reverse_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_api"]
exclude = [
    "src/reverse_api/cursor_bridge/node_modules/**",
]

[tool.hatch.build.targets.sdist]
# The sdist ships what is needed to build and verify the package: src/, tests/,
# and the project metadata. Everything below is repo furniture that only bloats
# the download — README images are served from raw.githubusercontent.com, so the
# binary assets are dead weight inside the tarball.
exclude = [
    "rae_autoscout.mp4",
    "assets/**",
    "examples/**",
    "design/**",
    "uv.lock",
    ".claude/settings.local.json",
    ".claude/worktrees/**",
    ".claude/plans/**",
    "src/reverse_api/cursor_bridge/node_modules/**",
    "website/**",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/reverse_api"]
omit = [
    "src/reverse_api/cli.py",
    "src/reverse_api/browser.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
